<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Macerası - Geometri Gezegeni</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2d3;
            --dark-bg: #10142b;
            --accent: #ff9f43;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-light: #c8d6e5;
        }

        body {
            margin: 0; padding: 0; font-family: 'Fredoka', sans-serif;
            background-color: var(--dark-bg); color: var(--text-light);
            height: 100vh; max-height: 615px; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-image: radial-gradient(circle at 15% 50%, rgba(0, 210, 211, 0.1) 0%, transparent 30%),
                              radial-gradient(circle at 85% 30%, rgba(255, 159, 67, 0.1) 0%, transparent 30%);
        }

        header { text-align: center; margin-bottom: 5px; z-index: 10; }
        h1 { font-family: 'Orbitron', sans-serif; margin: 0; color: var(--primary); font-size: 1.5rem; }
        .sub-title { color: var(--accent); margin-top: 2px; font-size: 0.85rem; font-weight: 600; }

        .games-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            width: 95%; max-width: 900px; z-index: 10; margin-bottom: 10px;
        }

        .game-card {
            background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 10px; text-align: center;
            transition: all 0.2s ease-in-out; cursor: pointer; backdrop-filter: blur(5px);
            display: flex; flex-direction: column; justify-content: space-between; height: 125px;
        }
        .game-card:hover { transform: translateY(-5px); border-color: var(--primary); background: rgba(0, 210, 211, 0.1); }
        .game-icon { font-size: 2rem; margin-bottom: 5px; transition: 0.3s; }
        .game-card:hover .game-icon { transform: scale(1.1); }
        .game-title { font-family: 'Orbitron', sans-serif; font-size: 0.95rem; color: #fff; margin-bottom: 3px; }
        .game-desc { font-size: 0.75rem; color: #8395a7; line-height: 1.2; }
        .play-btn {
            background: transparent; border: 1px solid var(--primary); color: var(--primary);
            padding: 4px 15px; border-radius: 15px; font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem; font-weight: bold; margin-top: 8px; transition: 0.3s;
        }
        .game-card:hover .play-btn { background: var(--primary); color: var(--dark-bg); }

        /* YENİ: ŞİFRE ÇÖZÜCÜ PANELİ */
        .password-panel {
            background: rgba(0,0,0,0.5); border: 1px solid var(--accent);
            border-radius: 10px; padding: 10px 20px; text-align: center;
            display: flex; align-items: center; gap: 15px;
        }
        .pw-title { font-family: 'Orbitron'; color: var(--accent); font-size: 0.9rem; margin: 0; }
        .letters { display: flex; gap: 8px; }
        .letter-box {
            width: 30px; height: 30px; background: #1e2749; border: 2px solid #34495e;
            border-radius: 5px; display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem; font-weight: bold; color: white; font-family: 'Orbitron';
        }
        .letter-box.found { background: var(--primary); border-color: #fff; color: #10142b; box-shadow: 0 0 10px var(--primary); }
    </style>
</head>
<body>

    <header>
        <h1>ROBOT MACERASI</h1>
        <div class="sub-title">3. TEMA: GEOMETRİK ŞEKİLLERİ KEŞFET</div>
    </header>

    <div class="games-grid">
        <div class="game-card" onclick="location.href='oyun1.html'">
            <div class="game-icon">🌉</div>
            <div><div class="game-title">KÖPRÜ İNŞASI</div><div class="game-desc">Doğru Parçası</div></div>
            <button class="play-btn">BAŞLAT</button>
        </div>
        <div class="game-card" onclick="location.href='oyun2.html'">
            <div class="game-icon">☄️</div>
            <div><div class="game-title">LAZER SAVUNMASI</div><div class="game-desc">Işın ve Doğru</div></div>
            <button class="play-btn">BAŞLAT</button>
        </div>
        <div class="game-card" onclick="location.href='oyun3.html'">
            <div class="game-icon">☀️</div>
            <div><div class="game-title">GÜNEŞ PANELİ</div><div class="game-desc">Açı Keşfi</div></div>
            <button class="play-btn">BAŞLAT</button>
        </div>
        <div class="game-card" onclick="location.href='oyun4.html'">
            <div class="game-icon">📡</div>
            <div><div class="game-title">RADAR AYARI</div><div class="game-desc">Çember ve Pergel</div></div>
            <button class="play-btn">BAŞLAT</button>
        </div>
        <div class="game-card" onclick="location.href='oyun5.html'">
            <div class="game-icon">📐</div>
            <div><div class="game-title">GÜVENLİ ROTA</div><div class="game-desc">Dikme (Gönye)</div></div>
            <button class="play-btn">BAŞLAT</button>
        </div>
        <div class="game-card" onclick="location.href='oyun6.html'">
            <div class="game-icon">⚙️</div>
            <div><div class="game-title">BARET TASARIMI</div><div class="game-desc">Çokgenler</div></div>
            <button class="play-btn">BAŞLAT</button>
        </div>
    </div>

    <div class="password-panel">
        <h3 class="pw-title">GİZLİ ŞİFRE:</h3>
        <div class="letters" id="password-boxes">
            <div class="letter-box" id="l1">?</div>
            <div class="letter-box" id="l2">?</div>
            <div class="letter-box" id="l3">?</div>
            <div class="letter-box" id="l4">?</div>
            <div class="letter-box" id="l5">?</div>
            <div class="letter-box" id="l6">?</div>
        </div>
    </div>

    <script>
        // Kaydedilen harfleri yükle
        window.onload = function() {
            for(let i=1; i<=6; i++) {
                let letter = localStorage.getItem('sifre_' + i);
                if(letter) {
                    let box = document.getElementById('l' + i);
                    box.innerText = letter;
                    box.classList.add('found');
                }
            }
        }
    </script>
</body>
</html>
